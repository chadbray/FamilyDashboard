round:var(--weekend)}.day.holiday{background:var(--holiday);border-color:#c9d3cc}.day.today{border-color:#eb846a;box-shadow:0 0 0 2px #e6674616}.dayhead{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}.day:first-child .dayhead{padding:15px 17px}.dayname{font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted);letter-spacing:.04em}.daynum{font-size:23px;line-height:1}.day:first-child .daynum{font-size:35px}.month-label{color:var(--muted);font-weight:750;font-size:13px}.weather{margin-left:auto;color:#455d58;font-size:13px;font-weight:850;white-space:nowrap}.holiday-label{font-size:11px;color:#526a64;font-weight:800}.events{padding:7px 8px;overflow:auto;scrollbar-width:thin}.day:first-child .events{padding:11px 12px}.empty{margin:8px;color:#929f9b;font-size:13px}.event{border-left:5px solid;border-radius:10px;padding:8px 9px;margin:5px 0}.day:first-child .event{padding:11px 12px;margin:7px 0}.eventtop{display:flex;justify-content:space-between;gap:8px}.person{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}.type{font-size:10px}.event h3{font-size:clamp(13px,1vw,16px);margin:2px 0 0;line-height:1.18}.day:first-child .event h3{font-size:clamp(16px,1.3vw,21px)}.event p{margin:4px 0 0;color:#49635d;font-size:12px;font-weight:800}.linked-note{font-size:11px!important;color:#58706a!important}.sidebar{min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 8px 32px #24493f0b}.sidehead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}.sidehead h2{margin:0;font-size:21px;letter-spacing:-.025em}.sidehead span{color:var(--muted);font-size:12px;font-weight:750}.months{min-height:0;flex:1;display:grid;grid-template-rows:repeat(3,1fr);gap:10px}.month{min-height:0;border:1px solid var(--line);border-radius:14px;padding:8px 9px;display:flex;flex-direction:column}.month h3{margin:0 0 5px;font-size:15px;text-align:center}.cal{min-height:0;flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);gap:2px}.dow{font-size:9px;text-align:center;text-transform:uppercase;color:var(--muted);font-weight:900}.cell{position:relative;min-width:0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,.8vw,13px);font-weight:750}.cell.weekend{background:var(--weekend)}.cell.holiday{background:var(--holiday);outline:1px solid #c9d3cc}.cell.active-week{box-shadow:inset 0 0 0 2px #e6674670;background:#fff3ef}.cell.active-week.weekend{background:#eadfd9}.cell.outside{opacity:.2}.cell.today{outline:2px solid var(--orange);background:#fff}.dots{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);display:flex;gap:2px}.dot{width:4px;height:4px;border-radius:50%}.holiday-key{margin:8px 2px 0;color:#71827e;font-size:10px;line-height:1.3}.footer{margin:10px 2px 0;color:#91a09c;font-size:11px;text-align:right}@media(max-width:1450px),(max-height:800px){.shell{grid-template-columns:minmax(0,1fr) clamp(320px,27vw,410px);gap:12px;padding:14px}.topbar,.legend{margin-bottom:9px}.legend span{padding:4px 8px}.week{gap:7px}.dayhead{padding:7px 9px}.day:first-child .dayhead{padding:10px 12px}.event{padding:6px 7px;margin:4px 0}.day:first-child .event{padding:8px 9px;margin:5px 0}.sidebar{padding:10px}.months{gap:6px}.month{padding:6px 7px}.month h3{font-size:13px;margin-bottom:3px}.sidehead{margin-bottom:6px}.sidehead h2{font-size:18px}.holiday-key{display:none}.footer{margin-top:5px}}@media(max-width:1050px){.shell{height:auto;overflow:visible;grid-template-columns:1fr}.sidebar{min-height:760px}.week{min-height:700px}}@media(orientation:portrait){.shell{display:none}.rotate{display:grid!important}}.rotate{display:none;height:100vh;place-items:center;padding:30px;text-align:center;font-size:22px;font-weight:850}

    .sidehead{align-items:flex-end}.sidehead h2{font-size:clamp(30px,2.4vw,46px);line-height:1;letter-spacing:-.045em}.legend span{font-size:14px;padding:7px 11px}.legend i{width:10px;height:10px}.months{grid-template-rows:repeat(2,1fr)}.month h3{font-size:18px}.cell{font-size:clamp(12px,.95vw,15px)}.dow{font-size:11px}
    h1,.sidehead h2{font-size:clamp(26px,2vw,38px)}.range{font-size:13px}.actions a{font-size:12px}.actions button{font-size:14px}.legend span{font-size:12px;padding:5px 9px}.legend i{width:9px;height:9px}.dayname{font-size:11px}.daynum{font-size:20px}.week>.day:first-child .daynum{font-size:30px}.month-label,.weather{font-size:11px}.holiday-label{font-size:10px}.empty{font-size:12px}.person,.type{font-size:9px}.event h3{font-size:clamp(12px,.9vw,14px)}.week>.day:first-child .event h3{font-size:clamp(14px,1.05vw,17px)}.event p{font-size:11px}.month h3{font-size:16px}.cell{font-size:clamp(11px,.85vw,13px)}.dow{font-size:9px}
    @media(max-height:850px) and (min-width:1051px){.shell{padding-top:10px;padding-bottom:10px}.week{height:calc(100vh - 124px);flex:none;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr))}.week>.day:first-child{grid-row:1/4;grid-column:auto}.events{min-height:0}.week>.day:first-child .events{padding:8px}.week>.day:first-child .event{margin:4px 0}.week>.day:first-child .event h3{font-size:clamp(14px,1.05vw,17px)}.week>.day:not(:first-child) .dayhead{padding:5px 8px}.week>.day:not(:first-child) .event{padding:5px 7px;margin:3px 0}.week>.day:not(:first-child) .event h3{font-size:12px}.week>.day:not(:first-child) .event p{font-size:10px;margin-top:2px}.sidehead span{display:none}.footer{display:none}}

</head>
<body>
  <div class="rotate">Turn this screen sideways to open the landscape family dashboard.</div>
  <main class="shell">
    <section class="main">
      <header class="topbar"><div><p class="eyebrow">THE BRAY FAMILY</p><div class="title-row"><h1>Our family week</h1><p class="range" id="range"></p></div></div><nav class="actions"><button id="prev" aria-label="Previous week">‹</button><button id="today">Today</button><button id="next" aria-label="Next week">›</button><a href="./" aria-label="Open phone dashboard">Phone view</a></nav></header>
      <section class="legend" id="legend" aria-label="Family colour key"></section>
      <section class="week" id="week" aria-live="polite"></section>
      <p class="footer">Aachen weather · Refreshes hourly 07:00–22:00 and when reopened</p>
    </section>
    <aside class="sidebar"><div class="sidehead"><h2>Two-month view</h2><span>Weekends shaded</span></div><div class="months" id="months"></div><div class="holiday-key" id="holiday-key"></div></aside>
  </main>
  <script>
const PEOPLE={penelope:{name:'Penelope',color:'#846BB8'},timothy:{name:'Timothy',color:'#4F88BD'},josie:{name:'Josie',color:'#F28C28'},chad:{name:'Chad',color:'#4F9478'},family:{name:'Family',color:'#6786A8'},alemannia:{name:'Alemannia',color:'#F4D03F'}};
const ONCE=[
 {date:'2026-09-05',title:'Quentin’s birthday party',person:'timothy',start:'12:00'},
 {date:'2026-09-08',title:'Ballet',person:'penelope',start:'15:45',end:'16:30',note:'Take ballet things to school · Change into ballet clothes at OGS'},
 {date:'2026-09-09',title:'Gogo leaves',person:'family',timeLabel:'Morning · Time TBC',responsible:'Chad',linkedTitle:'Gogo · Airport'},
 {date:'2026-09-12',title:'Alemannia vs Jahn Regensburg',person:'alemannia',start:'16:30',homeGame:true},
 {date:'2026-09-15',title:'Parents’ evening',person:'josie',start:'19:30'},
 {date:'2026-09-17',title:'Head Acoustics birthday party',person:'josie',timeLabel:'Until late'},
 {date:'2026-09-19',title:'Kindergarten grill',person:'family',start:'14:00'},
 {date:'2026-09-19',title:'Braai at the Mertens',person:'family',timeLabel:'Afternoon · Time TBC'},
 {date:'2026-09-19',title:'Alemannia vs Fortuna Düsseldorf',person:'alemannia',start:'14:00',homeGame:true},
 {date:'2026-09-21',title:'Kindergarten-Mitgliederversammlung',person:'josie',start:'19:00',location:'Summerlong'},
];
const BIRTHDAYS=[{md:'09-09',title:'Dale’s birthday'},{md:'09-10',title:'Grumps’s birthday'},{md:'09-10',title:'Diane’s birthday'},{md:'09-14',title:'Bradford’s birthday'}];
const REPEATS=[
 {from:'2026-09-14',to:'2026-12-31',weekday:1,title:'Pick up Penelope for swimming',person:'chad',start:'15:30',end:'16:15'},
 {from:'2026-09-08',to:'2026-12-31',weekday:2,title:'Pick up Timothy',person:'chad',start:'15:10',end:'15:30'},
 {from:'2026-09-08',to:'2026-12-31',weekday:2,title:'Pick up Penelope for ballet',person:'chad',start:'15:30',end:'15:45'},
 {from:'2026-09-15',to:'2026-12-31',weekday:2,title:'Ballet',person:'penelope',start:'15:45',end:'16:30',note:'Take ballet things to school · Change into ballet clothes at OGS'},
 {from:'2026-09-14',to:'2026-12-31',weekday:1,title:'Swimming lesson',person:'penelope',start:'16:15',end:'17:00'},
 {from:'2026-09-21',to:'2026-12-31',weekday:1,title:'Football',person:'timothy',start:'17:30',end:'18:30',responsible:'Chad',linkedTitle:'Timothy · Football'},
 {from:'2026-09-18',to:'2026-12-31',weekday:5,title:'Football',person:'timothy',start:'16:30',end:'17:30',responsible:'Chad',linkedTitle:'Timothy · Football'},
];
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>new Date(`${s}T12:00:00`),monday=d=>{d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d},mins=s=>{let[h,m]=s.split(':').map(Number);return h*60+m},dur=(a,b)=>{if(!a||!b)return'';let n=mins(b)-mins(a);return n>=60?`${Math.floor(n/60)}h${n%60?' '+n%60+'m':''}`:`${n}m`};
function easter(year){let a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;return new Date(year,month-1,day,12)}
function holidayFor(date){let y=date.getFullYear(),map={};const add=(d,name)=>map[iso(d)]=name,fixed=(m,d,name)=>add(new Date(y,m-1,d,12),name),move=(days,name)=>{let d=easter(y);d.setDate(d.getDate()+days);add(d,name)};fixed(1,1,'Neujahr');move(-2,'Karfreitag');move(1,'Ostermontag');fixed(5,1,'Tag der Arbeit');move(39,'Christi Himmelfahrt');move(50,'Pfingstmontag');move(60,'Fronleichnam');fixed(10,3,'Tag der Deutschen Einheit');fixed(11,1,'Allerheiligen');fixed(12,25,'1. Weihnachtstag');fixed(12,26,'2. Weihnachtstag');return map[iso(date)]||''}
function itemsFor(date){let key=iso(date),items=ONCE.filter(x=>x.date===key).map(x=>({...x}));for(const b of BIRTHDAYS)if(key.slice(5)===b.md)items.push({date:key,title:b.title,person:'family',birthday:true});for(const r of REPEATS)if(date.getDay()===r.weekday&&date>=parse(r.from)&&date<=parse(r.to))items.push({...r,date:key});if(key==='2026-09-18'){const football=items.find(e=>e.title==='Football'&&e.start==='16:30');if(football){football.responsible='Chad';football.linkedTitle='Timothy · Football'}}return items.sort((a,b)=>(a.start||'').localeCompare(b.start||''));}
function weatherIcon(code){if(code===0)return'☀️';if(code<=2)return'🌤️';if(code===3)return'☁️';if(code===45||code===48)return'🌫️';if(code>=51&&code<=67)return'🌧️';if(code>=71&&code<=77)return'🌨️';if(code>=80&&code<=82)return'🌦️';if(code>=85&&code<=86)return'🌨️';if(code>=95)return'⛈️';return'🌡️'}
async function getWeather(){const url='https://api.open-meteo.com/v1/forecast?latitude=50.7753&longitude=6.0839&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBerlin&forecast_days=16';const data=await fetch(url).then(r=>{if(!r.ok)throw new Error('weather');return r.json()});const weather={};data.daily.time.forEach((date,i)=>weather[date]={icon:weatherIcon(data.daily.weather_code[i]),high:Math.round(data.daily.temperature_2m_max[i]),low:Math.round(data.daily.temperature_2m_min[i])});return weather}
function scheduleDashboardRefresh(){const now=new Date(),next=new Date(now);next.setSeconds(0,0);next.setMinutes(0);next.setHours(now.getHours()+1);if(next.getHours()>22){next.setDate(next.getDate()+1);next.setHours(7,0,0,0)}else if(next.getHours()<7){next.setHours(7,0,0,0)}setTimeout(()=>location.reload(),Math.max(1000,next-now))}
function refreshWhenVisible(){let wasHidden=false;document.addEventListener('visibilitychange',()=>{if(document.hidden){wasHidden=true}else if(wasHidden){location.reload()}});window.addEventListener('pageshow',event=>{if(event.persisted)location.reload()})}

</script>
  <script>
    let WEATHER={},page=0;
    const currentDay=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
    const pageStart=()=>{if(page===0)return currentDay();let d=monday(currentDay());d.setDate(d.getDate()+page*7);return d};
    document.querySelector('#legend').innerHTML=Object.values(PEOPLE).map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join('');
    function eventCard(e){const p=PEOPLE[e.person],badge=e.birthday?'🎂 Birthday':e.homeGame?'⚽ Home':'';return `<div class="event" style="border-color:${p.color};background:${p.color}18"><div class="eventtop"><span class="person" style="color:${p.color}">${p.name}</span>${badge?`<span class="type">${badge}</span>`:''}</div><h3>${e.title}</h3><p>${e.start?`${e.start}${e.end?'–'+e.end:''}${dur(e.start,e.end)?` · ${dur(e.start,e.end)}`:''}`:(e.timeLabel||(!e.birthday?'Time TBC':''))}</p>${e.note?`<p class="event-note">🎒 ${e.note}</p>`:''}${e.responsible?`<p class="linked-note">↗ ${e.responsible} · ${e.linkedTitle||e.title}</p>`:''}</div>`}
    function renderWeek(){let anchor=pageStart(),end=new Date(anchor);end.setDate(end.getDate()+6);document.querySelector('#range').textContent=`${anchor.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;const today=iso(currentDay());document.querySelector('#prev').disabled=page===0;document.querySelector('#week').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(anchor);d.setDate(d.getDate()+i);const key=iso(d),list=itemsFor(d),holiday=holidayFor(d),weather=WEATHER[key],weekend=[0,6].includes(d.getDay());return `<article class="day ${weekend?'weekend ':''}${holiday?'holiday ':''}${key===today?'today':''}"><div class="dayhead"><span class="dayname">${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><strong class="daynum">${d.getDate()}</strong><span class="month-label">${d.toLocaleDateString('en-GB',{month:'short'})}</span>${holiday?`<span class="holiday-label">${holiday} · NRW</span>`:''}${weather?`<span class="weather">${weather.icon} ${weather.high}°/${weather.low}°</span>`:''}</div><div class="events">${list.length?list.map(eventCard).join(''):'<p class="empty">Nothing planned</p>'}</div></article>`}).join('')}
    function renderMonths(){const now=currentDay(),selectedStart=pageStart(),selectedEnd=new Date(selectedStart),holidayNames=new Set();selectedEnd.setDate(selectedEnd.getDate()+6);document.querySelector('#months').innerHTML=Array.from({length:2},(_,offset)=>{const first=new Date(selectedStart.getFullYear(),selectedStart.getMonth()+offset,1,12),month=first.getMonth(),gridStart=new Date(first);gridStart.setDate(first.getDate()-((first.getDay()+6)%7));const cells=Array.from({length:42},(_,i)=>{const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);const holiday=holidayFor(d),events=itemsFor(d),outside=d.getMonth()!==month,weekend=[0,6].includes(d.getDay()),active=d>=selectedStart&&d<=selectedEnd;if(holiday&&!outside)holidayNames.add(`${d.getDate()} ${d.toLocaleDateString('en-GB',{month:'short'})} · ${holiday}`);const colors=[...new Set(events.map(e=>PEOPLE[e.person].color))].slice(0,3);return `<div class="cell ${outside?'outside ':''}${weekend?'weekend ':''}${holiday?'holiday ':''}${active?'active-week ':''}${iso(d)===iso(now)?'today':''}" title="${active?'Selected week · ':''}${holiday||events.map(e=>e.title).join(', ')}"><span>${d.getDate()}</span>${colors.length?`<span class="dots">${colors.map(c=>`<i class="dot" style="background:${c}"></i>`).join('')}</span>`:''}</div>`}).join('');return `<section class="month"><h3>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<span class="dow">${x}</span>`).join('')}${cells}</div></section>`}).join('');document.querySelector('#holiday-key').textContent=holidayNames.size?`NRW holidays: ${[...holidayNames].join(' · ')}`:'NRW public holidays are shaded and labelled when they fall within these months.'}
    function render(){renderWeek();renderMonths()}
    document.querySelector('#prev').onclick=()=>{if(page>0){page--;render()}};document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#today').onclick=()=>{page=0;render()};render();getWeather().then(data=>{WEATHER=data;renderWeek()}).catch(()=>console.warn('Weather unavailable'));scheduleDashboardRefresh();refreshWhenVisible();
  </script>
</body>
