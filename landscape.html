<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f1">
  <title>Our Family Dashboard · Landscape</title>
  <style>
    :root{--ink:#183934;--muted:#71827e;--paper:#f5f6f1;--line:#d9e2dc;--white:#fff;--orange:#e66746;--weekend:#eef1ec;--holiday:#e3e8e2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}button,a{font:inherit}.shell{height:100vh;min-height:620px;display:grid;grid-template-columns:minmax(0,1fr) clamp(350px,27vw,520px);gap:18px;padding:22px;overflow:hidden}.main{min-width:0;display:flex;flex-direction:column}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}.eyebrow{margin:0 0 5px;color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.14em}.title-row{display:flex;align-items:baseline;gap:14px}h1{font-size:clamp(30px,2.4vw,46px);line-height:1;margin:0;letter-spacing:-.045em}.range{margin:0;color:var(--muted);font-size:clamp(14px,1vw,18px);font-weight:750}.actions{display:flex;gap:8px}.actions a,.actions button{display:grid;place-items:center;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none;font-weight:850;white-space:nowrap}.actions a{padding:0 14px;font-size:14px}.actions button{min-width:42px;padding:0 12px;font-size:16px}.actions button:first-child,.actions button:nth-child(3){width:42px;padding:0;font-size:22px}.actions button:disabled{opacity:.35}.legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.legend span{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:12px;font-weight:850}.legend i{width:9px;height:9px;border-radius:50%}.week{min-height:0;flex:1;display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:repeat(3,1fr);gap:10px}.day{min-height:0;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.day:first-child{grid-row:1/4}.day.weekend{background:var(--weekend)}.day.holiday{background:var(--holiday);border-color:#c9d3cc}.day.today{border-color:#eb846a;box-shadow:0 0 0 2px #e6674616}.dayhead{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line)}.day:first-child .dayhead{padding:15px 17px}.dayname{font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted);letter-spacing:.04em}.daynum{font-size:23px;line-height:1}.day:first-child .daynum{font-size:35px}.month-label{color:var(--muted);font-weight:750;font-size:13px}.weather{margin-left:auto;color:#455d58;font-size:13px;font-weight:850;white-space:nowrap}.holiday-label{font-size:11px;color:#526a64;font-weight:800}.events{padding:7px 8px;overflow:auto;scrollbar-width:thin}.day:first-child .events{padding:11px 12px}.empty{margin:8px;color:#929f9b;font-size:13px}.event{border-left:5px solid;border-radius:10px;padding:8px 9px;margin:5px 0}.day:first-child .event{padding:11px 12px;margin:7px 0}.eventtop{display:flex;justify-content:space-between;gap:8px}.person{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}.type{font-size:10px}.event h3{font-size:clamp(13px,1vw,16px);margin:2px 0 0;line-height:1.18}.day:first-child .event h3{font-size:clamp(16px,1.3vw,21px)}.event p{margin:4px 0 0;color:#49635d;font-size:12px;font-weight:800}.linked-note{font-size:11px!important;color:#58706a!important}.sidebar{min-width:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 8px 32px #24493f0b}.sidehead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}.sidehead h2{margin:0;font-size:21px;letter-spacing:-.025em}.sidehead span{color:var(--muted);font-size:12px;font-weight:750}.months{min-height:0;flex:1;display:grid;grid-template-rows:repeat(3,1fr);gap:10px}.month{min-height:0;border:1px solid var(--line);border-radius:14px;padding:8px 9px;display:flex;flex-direction:column}.month h3{margin:0 0 5px;font-size:15px;text-align:center}.cal{min-height:0;flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto repeat(6,1fr);gap:2px}.dow{font-size:9px;text-align:center;text-transform:uppercase;color:var(--muted);font-weight:900}.cell{position:relative;min-width:0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,.8vw,13px);font-weight:750}.cell.weekend{background:var(--weekend)}.cell.holiday{background:var(--holiday);outline:1px solid #c9d3cc}.cell.active-week{box-shadow:inset 0 0 0 2px #e6674670;background:#fff3ef}.cell.active-week.weekend{background:#eadfd9}.cell.outside{opacity:.2}.cell.today{outline:2px solid var(--orange);background:#fff}.dots{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);display:flex;gap:2px}.dot{width:4px;height:4px;border-radius:50%}.holiday-key{margin:8px 2px 0;color:#71827e;font-size:10px;line-height:1.3}.footer{margin:10px 2px 0;color:#91a09c;font-size:11px;text-align:right}@media(max-width:1450px),(max-height:800px){.shell{grid-template-columns:minmax(0,1fr) clamp(320px,27vw,410px);gap:12px;padding:14px}.topbar,.legend{margin-bottom:9px}.legend span{padding:4px 8px}.week{gap:7px}.dayhead{padding:7px 9px}.day:first-child .dayhead{padding:10px 12px}.event{padding:6px 7px;margin:4px 0}.day:first-child .event{padding:8px 9px;margin:5px 0}.sidebar{padding:10px}.months{gap:6px}.month{padding:6px 7px}.month h3{font-size:13px;margin-bottom:3px}.sidehead{margin-bottom:6px}.sidehead h2{font-size:18px}.holiday-key{display:none}.footer{margin-top:5px}}@media(max-width:1050px){.shell{height:auto;overflow:visible;grid-template-columns:1fr}.sidebar{min-height:760px}.week{min-height:700px}}@media(orientation:portrait){.shell{display:none}.rotate{display:grid!important}}.rotate{display:none;height:100vh;place-items:center;padding:30px;text-align:center;font-size:22px;font-weight:850}
  </style>
</head>
<body>
  <div class="rotate">Turn this screen sideways to open the landscape family dashboard.</div>
  <main class="shell">
    <section class="main">
      <header class="topbar"><div><p class="eyebrow">THE BRAY FAMILY</p><div class="title-row"><h1>Our family week</h1><p class="range" id="range"></p></div></div><nav class="actions"><button id="prev" aria-label="Previous week">‹</button><button id="today">Today</button><button id="next" aria-label="Next week">›</button><a href="./" aria-label="Open phone dashboard">Phone view</a></nav></header>
      <section class="legend" id="legend" aria-label="Family colour key"></section>
      <section class="week" id="week" aria-live="polite"></section>
      <p class="footer">Aachen weather · Refreshes hourly 07:00–22:00 and when reopened</p>
    </section>
    <aside class="sidebar"><div class="sidehead"><h2>Three-month view</h2><span>Weekends shaded</span></div><div class="months" id="months"></div><div class="holiday-key" id="holiday-key"></div></aside>
  </main>
  <script src="family-data.js"></script>
  <script>
    let WEATHER={},page=0;
    const currentDay=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
    const pageStart=()=>{if(page===0)return currentDay();let d=monday(currentDay());d.setDate(d.getDate()+page*7);return d};
    document.querySelector('#legend').innerHTML=Object.values(PEOPLE).map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join('');
    function eventCard(e){const p=PEOPLE[e.person],badge=e.birthday?'🎂 Birthday':e.homeGame?'⚽ Home':'';return `<div class="event" style="border-color:${p.color};background:${p.color}18"><div class="eventtop"><span class="person" style="color:${p.color}">${p.name}</span>${badge?`<span class="type">${badge}</span>`:''}</div><h3>${e.title}</h3><p>${e.start?`${e.start}${e.end?'–'+e.end:''}${dur(e.start,e.end)?` · ${dur(e.start,e.end)}`:''}`:(e.timeLabel||(!e.birthday?'Time TBC':''))}</p>${e.responsible?`<p class="linked-note">↗ ${e.responsible} · ${e.linkedTitle||e.title}</p>`:''}</div>`}
    function renderWeek(){let anchor=pageStart(),end=new Date(anchor);end.setDate(end.getDate()+6);document.querySelector('#range').textContent=`${anchor.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;const today=iso(currentDay());document.querySelector('#prev').disabled=page===0;document.querySelector('#week').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(anchor);d.setDate(d.getDate()+i);const key=iso(d),list=itemsFor(d),holiday=holidayFor(d),weather=WEATHER[key],weekend=[0,6].includes(d.getDay());return `<article class="day ${weekend?'weekend ':''}${holiday?'holiday ':''}${key===today?'today':''}"><div class="dayhead"><span class="dayname">${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><strong class="daynum">${d.getDate()}</strong><span class="month-label">${d.toLocaleDateString('en-GB',{month:'short'})}</span>${holiday?`<span class="holiday-label">${holiday} · NRW</span>`:''}${weather?`<span class="weather">${weather.icon} ${weather.high}°/${weather.low}°</span>`:''}</div><div class="events">${list.length?list.map(eventCard).join(''):'<p class="empty">Nothing planned</p>'}</div></article>`}).join('')}
    function renderMonths(){const now=currentDay(),selectedStart=pageStart(),selectedEnd=new Date(selectedStart),holidayNames=new Set();selectedEnd.setDate(selectedEnd.getDate()+6);document.querySelector('#months').innerHTML=Array.from({length:3},(_,offset)=>{const first=new Date(selectedStart.getFullYear(),selectedStart.getMonth()+offset,1,12),month=first.getMonth(),gridStart=new Date(first);gridStart.setDate(first.getDate()-((first.getDay()+6)%7));const cells=Array.from({length:42},(_,i)=>{const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);const holiday=holidayFor(d),events=itemsFor(d),outside=d.getMonth()!==month,weekend=[0,6].includes(d.getDay()),active=d>=selectedStart&&d<=selectedEnd;if(holiday&&!outside)holidayNames.add(`${d.getDate()} ${d.toLocaleDateString('en-GB',{month:'short'})} · ${holiday}`);const colors=[...new Set(events.map(e=>PEOPLE[e.person].color))].slice(0,3);return `<div class="cell ${outside?'outside ':''}${weekend?'weekend ':''}${holiday?'holiday ':''}${active?'active-week ':''}${iso(d)===iso(now)?'today':''}" title="${active?'Selected week · ':''}${holiday||events.map(e=>e.title).join(', ')}"><span>${d.getDate()}</span>${colors.length?`<span class="dots">${colors.map(c=>`<i class="dot" style="background:${c}"></i>`).join('')}</span>`:''}</div>`}).join('');return `<section class="month"><h3>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<span class="dow">${x}</span>`).join('')}${cells}</div></section>`}).join('');document.querySelector('#holiday-key').textContent=holidayNames.size?`NRW holidays: ${[...holidayNames].join(' · ')}`:'NRW public holidays are shaded and labelled when they fall within these months.'}
    function render(){renderWeek();renderMonths()}
    document.querySelector('#prev').onclick=()=>{if(page>0){page--;render()}};document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#today').onclick=()=>{page=0;render()};render();getWeather().then(data=>{WEATHER=data;renderWeek()}).catch(()=>console.warn('Weather unavailable'));scheduleDashboardRefresh();refreshWhenVisible();
  </script>
</body>
</html>
