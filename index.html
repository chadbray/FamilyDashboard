<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f1">
  <title>Our Family Week</title>
  <style>
    :root{--ink:#183934;--muted:#71827e;--paper:#f5f6f1;--line:#dde5df;--white:#fff;--orange:#e66746}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}button{font:inherit}main{max-width:1180px;margin:auto;padding:22px 15px 64px}.eyebrow{margin:0 0 6px;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.14em}h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.04em}.range{margin:9px 0 0;color:var(--muted);font-weight:650}.view-switch{display:inline-flex;margin-top:12px;padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:13px;font-weight:850;text-decoration:none}.legend{display:flex;gap:7px;overflow:auto;padding:12px 1px 13px;scrollbar-width:none}.legend span{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}.legend i{width:9px;height:9px;border-radius:50%}.nav{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;margin:2px 0 12px}.nav button{height:39px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-weight:800}.week{display:grid;gap:10px}.day{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.day.weekend{background:#f0f2ed}.day.holiday{background:#e7ebe5;border-color:#cfd8d0}.day.today{border-color:#ef927b;box-shadow:0 0 0 2px #e6674614}.dayhead{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid #dfe6e0}.dayhead span{font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted)}.dayhead strong{font-size:23px}.holiday-label{margin-left:auto;text-align:right;color:#526a64;font-size:10px;line-height:1.25}.holiday-label b{font-size:11px}.weather{margin-left:auto;display:flex;align-items:center;gap:5px;color:#455d58;font-size:12px;font-weight:850;white-space:nowrap}.holiday-label+.weather{margin-left:6px}.events{padding:7px}.empty{margin:8px;color:#929f9b;font-size:13px}.eventpair{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}.event{border-left:5px solid;border-radius:11px;padding:10px 11px;margin:6px 0}.eventpair .event{height:calc(100% - 12px)}.linked{position:relative}.linked:before{content:'↔';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:#6f817d}.eventtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.person{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.type{font-size:11px}.event h3{font-size:15px;margin:0}.event p{margin:4px 0 0;color:#5e716d;font-size:12px}.time{font-weight:800!important;color:#334f49!important}.time em{font-style:normal;font-size:10px;background:#fff9;border-radius:6px;padding:3px 5px;margin-left:5px}.tbc{color:#a06b15!important}.footer{text-align:center;color:#93a19e;font-size:12px;margin-top:16px}@media(min-width:760px){main{padding:34px}.view-switch{float:right;margin-top:-40px}.legend{padding-top:19px}.week{grid-template-columns:repeat(7,1fr);align-items:start;gap:8px}.day{min-height:420px}.dayhead{display:block}.dayhead strong{display:block}.holiday-label{display:block;margin:7px 0 0;text-align:left}.eventtop{display:block}.eventpair{grid-template-columns:1fr}.linked:before{display:none}}
  </style>
</head>
<body><main>
  <header><p class="eyebrow">THE BRAY FAMILY</p><h1>Our family week</h1><p class="range" id="range"></p><a class="view-switch" href="landscape.html">Monitor view</a></header>
  <section class="legend" id="legend"></section>
  <nav class="nav"><button id="prev" aria-label="Previous page">‹</button><button id="today">Today + 6 days</button><button id="next" aria-label="Next page">›</button></nav>
  <section class="week" id="week"></section>
  <p class="footer">Updated through ChatGPT · Refreshes when reopened</p>
</main><script src="family-data.js"></script><script>
let WEATHER={};
async function refreshWeather(){try{WEATHER=await getWeather();render()}catch(error){console.warn('Weather unavailable')}}
let page=0;const currentDay=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
function pageStart(){if(page===0)return currentDay();let d=monday(currentDay());d.setDate(d.getDate()+page*7);return d}
document.querySelector('#legend').innerHTML=Object.values(PEOPLE).map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join('');
function render(){let anchor=pageStart(),end=new Date(anchor);end.setDate(end.getDate()+6);document.querySelector('#range').textContent=`${anchor.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;let today=iso(new Date()),prev=document.querySelector('#prev'),centre=document.querySelector('#today');prev.disabled=page===0;prev.style.opacity=page===0?'.35':'1';centre.textContent=page===0?'Today + 6 days':`${anchor.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}`;document.querySelector('#week').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(anchor);d.setDate(d.getDate()+i);let list=itemsFor(d),holiday=holidayFor(d),weather=WEATHER[iso(d)],weekend=d.getDay()===0||d.getDay()===6;return `<article class="day ${weekend?'weekend ':''}${holiday?'holiday ':''}${iso(d)===today?'today':''}"><div class="dayhead"><span>${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><strong>${d.getDate()}</strong>${holiday?`<small class="holiday-label"><b>${holiday}</b><br>Public holiday · NRW</small>`:''}${weather?`<small class="weather">${weather.icon} ${weather.high}°/${weather.low}°</small>`:''}</div><div class="events">${list.length?list.map(e=>{let p=PEOPLE[e.person];let badge=e.birthday?'🎂 Birthday':e.homeGame?'⚽ Home':'';let main=`<div class="event" style="border-color:${p.color};background:${p.color}18"><div class="eventtop"><span class="person" style="color:${p.color}">${p.name}</span>${badge?`<span class="type">${badge}</span>`:''}</div><h3>${e.title}</h3>${e.start?`<p class="time">${e.start}${e.end?'–'+e.end:''}${dur(e.start,e.end)?` <em>${dur(e.start,e.end)}</em>`:''}</p>`:!e.birthday?`<p class="time tbc">${e.timeLabel||'Time TBC'}</p>`:''}</div>`;if(!e.responsible)return main;let adult=PEOPLE[e.responsible.toLowerCase()];return `<div class="eventpair">${main}<div class="event linked" style="border-color:${adult.color};background:${adult.color}12"><div class="eventtop"><span class="person" style="color:${adult.color}">${adult.name}</span><span class="type">Taking</span></div><h3>${e.linkedTitle||e.title}</h3><p class="time ${e.start?'':'tbc'}">${e.start?`${e.start}${e.end?'–'+e.end:''}`:(e.timeLabel||'Time TBC')}</p></div></div>`}).join(''):'<p class="empty">Nothing planned</p>'}</div></article>`}).join('')}
document.querySelector('#prev').onclick=()=>{if(page>0){page--;render()}};document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#today').onclick=()=>{page=0;render()};render();
scheduleDashboardRefresh();
refreshWeather();
refreshWhenVisible();
</script></body></html>
