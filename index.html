<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f1">
  <title>Our Family Week</title>
  <style>
    :root{--ink:#183934;--muted:#71827e;--paper:#f5f6f1;--line:#dde5df;--white:#fff;--orange:#e66746}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}button{font:inherit}main{max-width:1180px;margin:auto;padding:22px 15px 64px}.eyebrow{margin:0 0 6px;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.14em}h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.04em}.range{margin:9px 0 0;color:var(--muted);font-weight:650}.legend{display:flex;gap:7px;overflow:auto;padding:19px 1px 13px;scrollbar-width:none}.legend span{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}.legend i{width:9px;height:9px;border-radius:50%}.nav{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;margin:2px 0 12px}.nav button{height:39px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-weight:800}.week{display:grid;gap:10px}.day{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.day.weekend{background:#f0f2ed}.day.holiday{background:#e7ebe5;border-color:#cfd8d0}.day.today{border-color:#ef927b;box-shadow:0 0 0 2px #e6674614}.dayhead{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid #dfe6e0}.dayhead span{font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted)}.dayhead strong{font-size:23px}.holiday-label{margin-left:auto;text-align:right;color:#526a64;font-size:10px;line-height:1.25}.holiday-label b{font-size:11px}.events{padding:7px}.empty{margin:8px;color:#929f9b;font-size:13px}.eventpair{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}.event{border-left:5px solid;border-radius:11px;padding:10px 11px;margin:6px 0}.eventpair .event{height:calc(100% - 12px)}.linked{position:relative}.linked:before{content:'↔';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:#6f817d}.eventtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.person{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.type{font-size:11px}.event h3{font-size:15px;margin:0}.event p{margin:4px 0 0;color:#5e716d;font-size:12px}.time{font-weight:800!important;color:#334f49!important}.time em{font-style:normal;font-size:10px;background:#fff9;border-radius:6px;padding:3px 5px;margin-left:5px}.tbc{color:#a06b15!important}.footer{text-align:center;color:#93a19e;font-size:12px;margin-top:16px}@media(min-width:760px){main{padding:34px}.week{grid-template-columns:repeat(7,1fr);align-items:start;gap:8px}.day{min-height:420px}.dayhead{display:block}.dayhead strong{display:block}.holiday-label{display:block;margin:7px 0 0;text-align:left}.eventtop{display:block}.eventpair{grid-template-columns:1fr}.linked:before{display:none}}
  </style>
</head>
<body><main>
  <header><p class="eyebrow">THE BRAY FAMILY</p><h1>Our family week</h1><p class="range" id="range"></p></header>
  <section class="legend" id="legend"></section>
  <nav class="nav"><button id="prev" aria-label="Previous page">‹</button><button id="today">Today + 6 days</button><button id="next" aria-label="Next page">›</button></nav>
  <section class="week" id="week"></section>
  <p class="footer">Updated through ChatGPT · Times shown in Aachen local time</p>
</main><script>
const PEOPLE={penelope:{name:'Penelope',color:'#8B5CF6'},timothy:{name:'Timothy',color:'#3987F5'},josie:{name:'Josie',color:'#F06D6D'},chad:{name:'Chad',color:'#2DA77A'},family:{name:'Family',color:'#D68A13'},alemannia:{name:'Alemannia',color:'#F3C500'}};
const ONCE=[
 {date:'2026-09-05',title:'Quentin’s birthday party',person:'timothy'},
 {date:'2026-09-08',title:'Ballet',person:'penelope',start:'15:45',end:'16:30'},
 {date:'2026-09-09',title:'Gogo leaves',person:'family',timeLabel:'Morning · Time TBC',responsible:'Chad',linkedTitle:'Gogo · Airport'},
 {date:'2026-09-12',title:'Alemannia vs Jahn Regensburg',person:'alemannia',start:'16:30',homeGame:true},
 {date:'2026-09-15',title:'Football',person:'timothy'},
 {date:'2026-09-15',title:'Parents’ evening',person:'josie',start:'19:30'},
 {date:'2026-09-17',title:'Head Acoustics birthday party',person:'josie'},
 {date:'2026-09-19',title:'Kindergarten grill',person:'family',start:'14:00'},
 {date:'2026-09-19',title:'Alemannia vs Fortuna Düsseldorf',person:'alemannia',start:'14:00',homeGame:true},
];
const BIRTHDAYS=[{md:'09-09',title:'Dale’s birthday'},{md:'09-10',title:'Grumps’s birthday'},{md:'09-10',title:'Diane’s birthday'},{md:'09-14',title:'Bradford’s birthday'}];
const REPEATS=[
 {from:'2026-09-15',to:'2026-12-31',weekday:2,title:'Ballet',person:'penelope',start:'15:45',end:'16:30'},
 {from:'2026-09-14',to:'2026-12-31',weekday:1,title:'Swimming lesson',person:'penelope',start:'16:15',end:'17:00'},
 {from:'2026-09-18',to:'2026-12-31',weekday:5,title:'Football',person:'timothy',start:'16:30',end:'17:30'},
 {from:'2026-09-21',to:'2026-12-31',weekday:1,title:'Football',person:'timothy',start:'17:30',end:'18:30'},
];
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>new Date(`${s}T12:00:00`),monday=d=>{d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d},mins=s=>{let[h,m]=s.split(':').map(Number);return h*60+m},dur=(a,b)=>{if(!a||!b)return'';let n=mins(b)-mins(a);return n>=60?`${Math.floor(n/60)}h${n%60?' '+n%60+'m':''}`:`${n}m`};
function easter(year){let a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1;return new Date(year,month-1,day,12)}
function holidayFor(date){let y=date.getFullYear(),map={};const add=(d,name)=>map[iso(d)]=name,fixed=(m,d,name)=>add(new Date(y,m-1,d,12),name),move=(days,name)=>{let d=easter(y);d.setDate(d.getDate()+days);add(d,name)};fixed(1,1,'Neujahr');move(-2,'Karfreitag');move(1,'Ostermontag');fixed(5,1,'Tag der Arbeit');move(39,'Christi Himmelfahrt');move(50,'Pfingstmontag');move(60,'Fronleichnam');fixed(10,3,'Tag der Deutschen Einheit');fixed(11,1,'Allerheiligen');fixed(12,25,'1. Weihnachtstag');fixed(12,26,'2. Weihnachtstag');return map[iso(date)]||''}
let page=0;const currentDay=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
function pageStart(){if(page===0)return currentDay();let d=monday(currentDay());d.setDate(d.getDate()+page*7);return d}
document.querySelector('#legend').innerHTML=Object.values(PEOPLE).map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join('');
function itemsFor(date){let key=iso(date),items=ONCE.filter(x=>x.date===key);for(const b of BIRTHDAYS)if(key.slice(5)===b.md)items.push({date:key,title:b.title,person:'family',birthday:true});for(const r of REPEATS)if(date.getDay()===r.weekday&&date>=parse(r.from)&&date<=parse(r.to))items.push({...r,date:key});if(key==='2026-09-18'){const football=items.find(e=>e.title==='Football'&&e.start==='16:30');if(football){football.responsible='Chad';football.linkedTitle='Timothy · Football'}}return items.sort((a,b)=>(a.start||'').localeCompare(b.start||''));}
function render(){let anchor=pageStart(),end=new Date(anchor);end.setDate(end.getDate()+6);document.querySelector('#range').textContent=`${anchor.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;let today=iso(new Date()),prev=document.querySelector('#prev'),centre=document.querySelector('#today');prev.disabled=page===0;prev.style.opacity=page===0?'.35':'1';centre.textContent=page===0?'Today + 6 days':`${anchor.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}`;document.querySelector('#week').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(anchor);d.setDate(d.getDate()+i);let list=itemsFor(d),holiday=holidayFor(d),weekend=d.getDay()===0||d.getDay()===6;return `<article class="day ${weekend?'weekend ':''}${holiday?'holiday ':''}${iso(d)===today?'today':''}"><div class="dayhead"><span>${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><strong>${d.getDate()}</strong>${holiday?`<small class="holiday-label"><b>${holiday}</b><br>Public holiday · NRW</small>`:''}</div><div class="events">${list.length?list.map(e=>{let p=PEOPLE[e.person];let badge=e.birthday?'🎂 Birthday':e.homeGame?'⚽ Home':'';let main=`<div class="event" style="border-color:${p.color};background:${p.color}18"><div class="eventtop"><span class="person" style="color:${p.color}">${p.name}</span>${badge?`<span class="type">${badge}</span>`:''}</div><h3>${e.title}</h3>${e.start?`<p class="time">${e.start}${e.end?'–'+e.end:''}${dur(e.start,e.end)?` <em>${dur(e.start,e.end)}</em>`:''}</p>`:!e.birthday?`<p class="time tbc">${e.timeLabel||'Time TBC'}</p>`:''}</div>`;if(!e.responsible)return main;let adult=PEOPLE[e.responsible.toLowerCase()];return `<div class="eventpair">${main}<div class="event linked" style="border-color:${adult.color};background:${adult.color}12"><div class="eventtop"><span class="person" style="color:${adult.color}">${adult.name}</span><span class="type">Taking</span></div><h3>${e.linkedTitle||e.title}</h3><p class="time ${e.start?'':'tbc'}">${e.start?`${e.start}${e.end?'–'+e.end:''}`:(e.timeLabel||'Time TBC')}</p></div></div>`}).join(''):'<p class="empty">Nothing planned</p>'}</div></article>`}).join('')}
document.querySelector('#prev').onclick=()=>{if(page>0){page--;render()}};document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#today').onclick=()=>{page=0;render()};render();
</script></body></html>
