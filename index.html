<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f1">
  <title>Our Family Week</title>
  <style>
    :root{--ink:#183934;--muted:#71827e;--paper:#f5f6f1;--line:#dde5df;--white:#fff;--orange:#e66746}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}button{font:inherit}main{max-width:1180px;margin:auto;padding:22px 15px 64px}.eyebrow{margin:0 0 6px;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.14em}h1{font-size:34px;line-height:1;margin:0;letter-spacing:-.04em}.range{margin:9px 0 0;color:var(--muted);font-weight:650}.legend{display:flex;gap:7px;overflow:auto;padding:19px 1px 13px;scrollbar-width:none}.legend span{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap}.legend i{width:9px;height:9px;border-radius:50%}.nav{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;margin:2px 0 12px}.nav button{height:39px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-weight:800}.week{display:grid;gap:10px}.day{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.day.today{border-color:#ef927b;box-shadow:0 0 0 2px #e6674614}.dayhead{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid #edf1ee}.dayhead span{font-size:12px;text-transform:uppercase;font-weight:900;color:var(--muted)}.dayhead strong{font-size:23px}.events{padding:7px}.empty{margin:8px;color:#9ba7a4;font-size:13px}.eventpair{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}.event{border-left:5px solid;border-radius:11px;padding:10px 11px;margin:6px 0}.eventpair .event{height:calc(100% - 12px)}.linked{position:relative}.linked:before{content:'↔';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;color:#6f817d}.eventtop{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.person{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.type{font-size:11px}.event h3{font-size:15px;margin:0}.event p{margin:4px 0 0;color:#5e716d;font-size:12px}.time{font-weight:800!important;color:#334f49!important}.time em{font-style:normal;font-size:10px;background:#fff9;border-radius:6px;padding:3px 5px;margin-left:5px}.tbc{color:#a06b15!important}.footer{text-align:center;color:#93a19e;font-size:12px;margin-top:16px}@media(min-width:760px){main{padding:34px}.week{grid-template-columns:repeat(7,1fr);align-items:start;gap:8px}.day{min-height:420px}.dayhead{display:block}.dayhead strong{display:block}.eventtop{display:block}.eventpair{grid-template-columns:1fr}.linked:before{display:none}}
  </style>
</head>
<body><main>
  <header><p class="eyebrow">THE BRAY FAMILY</p><h1>Our family week</h1><p class="range" id="range"></p></header>
  <section class="legend" id="legend"></section>
  <nav class="nav"><button id="prev" aria-label="Previous page">‹</button><button id="today">Today + 6 days</button><button id="next" aria-label="Next page">›</button></nav>
  <section class="week" id="week"></section>
  <p class="footer">Updated through ChatGPT · Times shown in Aachen local time</p>
</main><script>
const PEOPLE={penelope:{name:'Penelope',color:'#8B5CF6'},timothy:{name:'Timothy',color:'#3987F5'},josie:{name:'Josie',color:'#F06D6D'},chad:{name:'Chad',color:'#2DA77A'},family:{name:'Family',color:'#D68A13'}};
const ONCE=[
 {date:'2026-09-08',title:'Ballet',person:'penelope',start:'15:45',end:'16:30'},
 {date:'2026-09-15',title:'Football',person:'timothy'},
 {date:'2026-09-15',title:'Parents’ evening',person:'penelope',start:'19:30'},
 {date:'2026-09-17',title:'Head Acoustics birthday party',person:'josie'},
];
const BIRTHDAYS=[{md:'09-09',title:'Dale’s birthday'},{md:'09-10',title:'Grumps’s birthday'},{md:'09-10',title:'Diane’s birthday'},{md:'09-14',title:'Bradford’s birthday'}];
const REPEATS=[
 {from:'2026-09-15',to:'2026-12-31',weekday:2,title:'Ballet',person:'penelope',start:'15:45',end:'16:30'},
 {from:'2026-09-14',to:'2026-12-31',weekday:1,title:'Swimming lesson',person:'penelope',start:'16:15',end:'17:00'},
 {from:'2026-09-18',to:'2026-12-31',weekday:5,title:'Football',person:'timothy',start:'16:30',end:'17:30'},
 {from:'2026-09-21',to:'2026-12-31',weekday:1,title:'Football',person:'timothy',start:'17:30',end:'18:30'},
];
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>new Date(`${s}T12:00:00`),monday=d=>{d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d},mins=s=>{let[h,m]=s.split(':').map(Number);return h*60+m},dur=(a,b)=>{if(!a||!b)return'';let n=mins(b)-mins(a);return n>=60?`${Math.floor(n/60)}h${n%60?' '+n%60+'m':''}`:`${n}m`};
let page=0;const currentDay=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
function pageStart(){if(page===0)return currentDay();let d=monday(currentDay());d.setDate(d.getDate()+page*7);return d}
document.querySelector('#legend').innerHTML=Object.values(PEOPLE).map(p=>`<span><i style="background:${p.color}"></i>${p.name}</span>`).join('');
function itemsFor(date){let key=iso(date),items=ONCE.filter(x=>x.date===key);for(const b of BIRTHDAYS)if(key.slice(5)===b.md)items.push({date:key,title:b.title,person:'family',birthday:true});for(const r of REPEATS)if(date.getDay()===r.weekday&&date>=parse(r.from)&&date<=parse(r.to))items.push({...r,date:key});if(key==='2026-09-18'){const football=items.find(e=>e.title==='Football'&&e.start==='16:30');if(football)football.responsible='Chad'}return items.sort((a,b)=>(a.start||'').localeCompare(b.start||''));}
function render(){let anchor=pageStart(),end=new Date(anchor);end.setDate(end.getDate()+6);document.querySelector('#range').textContent=`${anchor.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${end.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;let today=iso(new Date()),prev=document.querySelector('#prev');prev.disabled=page===0;prev.style.opacity=page===0?'.35':'1';document.querySelector('#week').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(anchor);d.setDate(d.getDate()+i);let list=itemsFor(d);return `<article class="day ${iso(d)===today?'today':''}"><div class="dayhead"><span>${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><strong>${d.getDate()}</strong></div><div class="events">${list.length?list.map(e=>{let p=PEOPLE[e.person];let main=`<div class="event" style="border-color:${p.color};background:${p.color}12"><div class="eventtop"><span class="person" style="color:${p.color}">${p.name}</span>${e.birthday?'<span class="type">🎂 Birthday</span>':''}</div><h3>${e.title}</h3>${e.start?`<p class="time">${e.start}${e.end?'–'+e.end:''}${dur(e.start,e.end)?` <em>${dur(e.start,e.end)}</em>`:''}</p>`:!e.birthday?'<p class="time tbc">Time TBC</p>':''}</div>`;if(!e.responsible)return main;let adult=PEOPLE[e.responsible.toLowerCase()];return `<div class="eventpair">${main}<div class="event linked" style="border-color:${adult.color};background:${adult.color}12"><div class="eventtop"><span class="person" style="color:${adult.color}">${adult.name}</span><span class="type">Taking</span></div><h3>Timothy · ${e.title}</h3><p class="time">${e.start}${e.end?'–'+e.end:''}</p></div></div>`}).join(''):'<p class="empty">Nothing planned</p>'}</div></article>`}).join('')}
document.querySelector('#prev').onclick=()=>{if(page>0){page--;render()}};document.querySelector('#next').onclick=()=>{page++;render()};document.querySelector('#today').onclick=()=>{page=0;render()};render();
</script></body></html>
